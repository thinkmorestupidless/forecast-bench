# Build and test on every push and pull request. Needs no secrets, so it is green from the first
# push — before anything about a control plane has been configured.
name: ci
on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: sbt
      - uses: sbt/setup-sbt@v1
      # The integration tests start a throwaway Postgres through testcontainers, which a
      # GitHub-hosted runner can do: Docker is already there.
      - run: sbt scalafmtCheckAll scalafmtSbtCheck compile test

  # The living features, the glossary and the specs that name them, as `just check` runs it.
  features:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - run: uvx --from "git+https://github.com/thinkmorestupidless/speckit-bdd@v0.2.0#subdirectory=checker" speckit-bdd check --root . --glossary GLOSSARY.md --features features --specs specs

  # Every commit of a pull request, and its title, is a Conventional Commit: the check the commit-msg
  # hook makes, for a clone that did not enable it. The title matters because the squash merge makes
  # it the commit on main. README.md, "Commits and pull requests", says what to write.
  commits:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    env:
      TITLE: ${{ github.event.pull_request.title }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - run: .githooks/check-commits "${{ github.event.pull_request.base.sha }}" "${{ github.event.pull_request.head.sha }}"
