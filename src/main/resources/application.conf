# Your service's configuration. Anything here sits above ankka's defaults (ankka-runtime's
# reference.conf, which documents every key) and above the platform's cluster overlay, so it wins.
#
# Nothing is needed to start. The database defaults to localhost:5432, ankka/ankka/ankka — what
# docker-compose.yml starts — and in an ankka deployment the platform sets ANKKA_DB_HOST,
# ANKKA_DB_PORT, ANKKA_DB_NAME, ANKKA_DB_USER and ANKKA_DB_PASSWORD from the database it provisioned.
# To point a local run elsewhere, set those variables rather than editing keys here.
#
# The HTTP port defaults to 9000 and is set by ANKKA_HTTP_PORT; the platform sets that too.

# The service's name for a local run: each view or consumer that reads a topic does so under a
# consumer group named for it, so two services on one broker never share one. A deployed service's
# name comes from the platform, and this key is not read there.
ankka.service.name = "forecast-bench"

# Where other services are on this machine: the reasoning service of the `reasoning` compose
# profile. A deployed service finds it by name.
ankka.local-services.reasoning = "http://localhost:9100"

# The bench's own settings (specs/001-forecast-evaluation/research.md R6, R5, R12, R9).
bench {
  # Each model a cohort may name. A model with no price is refused at start: the cost of every run
  # is computed from these, and a price is only honest with the date it was read.
  models = [
    {
      name = "claude-opus-5-5"
      provider = "anthropic"
      model = "claude-opus-5-5"
      max-tokens = 16000
      # Opus 5.5 always thinks; effort is the control, and its default is medium.
      thinking = true
      effort = "high"
      prices {
        input-per-million = 4.00
        output-per-million = 20.00
        read = "2026-11-03"
      }
    }
  ]

  # Question workflows in flight at once for one cohort.
  concurrency = 6

  limits {
    # Documents in a pack, characters in an excerpt (the reasoning service's excerpt limit).
    documents = 12
    excerpt = 2000
    # Searches for a question, results asked of each.
    searches = 3
    results = 10
  }

  # The venues questions are imported from, by name, and where each is read.
  venues {
    kalshi = "https://api.elections.kalshi.com/trade-api/v2"
    polymarket = "https://gamma-api.polymarket.com"
  }

  # How often outcomes are read from the venues.
  outcomes-every = 1h

  # How the graph is read for an appraisal: each claim waited for up to the limit, and a read the
  # graph has not caught up with made again, three times in all, the pause apart.
  graph-read {
    wait-limit = 30s
    attempts = 3
    pause = 10s
  }
}
